spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/staymmate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8081}
  tomcat:
    # Avoids a Windows JDK loopback-selector failure seen with the NIO connector.
    protocol: org.apache.coyote.http11.Http11Nio2Protocol
